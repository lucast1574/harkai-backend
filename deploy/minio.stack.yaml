services:
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - type: bind
        source: /srv/minio-data/harkai/minio
        target: /data
    networks:
      dokploy-network:
        aliases: [harkai-minio]
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == rangelserver1]
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
        reservations:
          memory: 128M
      restart_policy:
        condition: on-failure
  initialize:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    entrypoint: ['/bin/sh', '-ec']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    command:
      - |
        n=0
        until mc alias set storage http://harkai-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          n=$$((n+1)); [ "$$n" -lt 60 ] || exit 1; sleep 2
        done
        mc mb --ignore-existing storage/harkai-photos
        mc anonymous set none storage/harkai-photos
        mc quota set storage/harkai-photos --size 10GiB
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::harkai-photos"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject"],"Resource":["arn:aws:s3:::harkai-photos/photos/*"]}]}' > /tmp/photos-policy.json
        mc admin policy create storage harkai-photos /tmp/photos-policy.json
        mc admin user add storage "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc admin policy attach storage harkai-photos --user "$$S3_ACCESS_KEY"
        mc quota info storage/harkai-photos
    networks: [dokploy-network]
    deploy:
      placement:
        constraints: [node.hostname == rangelserver1]
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
      restart_policy:
        condition: none
networks:
  dokploy-network:
    external: true
