services:
  api:
    build: .
    ports:
    - 127.0.0.1:8080:8080
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: harkai_local
      CORS_ORIGINS: http://localhost:3000
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: harkai-local-api
      S3_SECRET_KEY: local-api-development-only-password
      S3_BUCKET: harkai-photos
      S3_USE_SSL: 'false'
    depends_on:
      mongo:
        condition: service_healthy
      initialize:
        condition: service_completed_successfully
  mongo:
    image: mongo:7
    volumes:
    - harkai_local:/data/db
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - db.adminCommand('ping').ok
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: harkai-local-root
      MINIO_ROOT_PASSWORD: local-development-only-password
    volumes:
    - harkai_photos:/data
    networks:
    - default
    ports:
    - 127.0.0.1:9000:9000
    mem_limit: 512m
  initialize:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    entrypoint:
    - /bin/sh
    - -ec
    environment:
      MINIO_ROOT_USER: harkai-local-root
      MINIO_ROOT_PASSWORD: local-development-only-password
      S3_ACCESS_KEY: harkai-local-api
      S3_SECRET_KEY: local-api-development-only-password
    command:
    - "n=0\nuntil mc alias set storage http://minio:9000 \"$$MINIO_ROOT_USER\" \"\
      $$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1; do\n  n=$$((n+1)); [ \"$$n\" -lt 60\
      \ ] || exit 1; sleep 2\ndone\nmc mb --ignore-existing storage/harkai-photos\n\
      mc anonymous set none storage/harkai-photos\nmc quota set storage/harkai-photos\
      \ --size 10GiB\nprintf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"\
      Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\",\"s3:ListBucket\"],\"\
      Resource\":[\"arn:aws:s3:::harkai-photos\"]},{\"Effect\":\"Allow\",\"Action\"\
      :[\"s3:GetObject\",\"s3:PutObject\"],\"Resource\":[\"arn:aws:s3:::harkai-photos/photos/*\"\
      ]}]}' > /tmp/photos-policy.json\nmc admin policy create storage harkai-photos\
      \ /tmp/photos-policy.json\nmc admin user add storage \"$$S3_ACCESS_KEY\" \"\
      $$S3_SECRET_KEY\"\nmc admin policy attach storage harkai-photos --user \"$$S3_ACCESS_KEY\"\
      \nmc quota info storage/harkai-photos\n"
    networks:
    - default
volumes:
  harkai_local: null
  harkai_photos: null
